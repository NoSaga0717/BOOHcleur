org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true

# Même version que app/CMakeLists.txt : Gradle la clone dans android/build/
# (les sources Java de JUCE sont compilées par Gradle, le C++ par CMake).
juceVersion=8.0.15

# Options (ligne de commande : -PnomOption=valeur) :
#   juceDir=/chemin/vers/JUCE   utiliser une copie locale de JUCE
#   ndkVersion=27.2.12479018     imposer une version du NDK
#   abis=arm64-v8a,armeabi-v7a   architectures compilées (défaut : arm64-v8a)
