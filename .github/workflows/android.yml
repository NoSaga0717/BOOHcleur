name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: APK de test
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # mise à jour de la pré-version « android-test » (main seulement)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Clé de debug conservée d'une exécution à l'autre : sans elle, chaque APK
      # aurait une signature différente et Android refuserait la mise à jour.
      - name: Clé de signature (cache)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: boohcleur-android-debug-keystore

      - name: Build
        working-directory: android
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK : $NDK"
          ./gradlew --no-daemon assembleRelease -PndkVersion="$(basename "$NDK")"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/BOOHcleur-android.apk"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BOOHcleur-Android
          path: BOOHcleur-android.apk

      # Lien de téléchargement direct, pratique depuis le téléphone (sans zip).
      - name: Pré-version android-test
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-test >/dev/null 2>&1; then
            gh release create android-test --prerelease --target "$GITHUB_SHA" \
              --title "APK Android de test" --notes "APK de test, mise à jour à chaque commit sur main."
          fi
          gh release upload android-test BOOHcleur-android.apk --clobber
          gh release edit android-test --notes "APK de test construite depuis ${GITHUB_SHA::7} (main). Installation : voir android/README.md."
